spring.application.name=cobranca
server.port=8080

spring.datasource.url=jdbc:h2:file:~/cobranca-beira/cobranca;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COBRANCA_COOKIE_SECURE:false}
app.admin.email=${COBRANCA_ADMIN_EMAIL:admin@beira.gov.mz}
app.admin.password=${COBRANCA_ADMIN_PASSWORD:}
app.cors.allowed-origins=${COBRANCA_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
